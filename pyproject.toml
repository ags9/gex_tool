[project]
name = "gexbot"
version = "0.1.0"
description = "GEX regime-switched SPX/XSP trading system — data pipeline (Phase 0)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",          # Massive/Polygon flat files are served via S3-compatible endpoint
    "polars>=1.0",          # streaming CSV->Parquet filtering
    "duckdb>=1.0",
    "numpy>=1.26",          # download manifest + later the single state store
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "fastapi>=0.115",        # read-only state API (localhost only)
    "uvicorn>=0.30",
    "websockets>=12.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",           # progress bars / pretty CLI
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
