[project]
name = "gexbot"
version = "0.1.0"
description = "GEX regime-switched SPX/XSP trading system — data pipeline (Phase 0)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "polars>=1.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.ruff]
line-length = 100
